<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StartupMate AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.18), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255,255,255,.15), transparent 40%),
        linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
    }
    #app {
      width: 100%; max-width: 760px; height: 90vh;
      display: flex; flex-direction: column;
      background: #fff; border-radius: 20px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px; color: #fff;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
    }
    .logo {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    header h1 { font-size: 19px; }
    header p { font-size: 13px; opacity: .85; margin-top: 2px; }
    .online { margin-left: auto; font-size: 12px; opacity: .9; }
    .online::before { content: "●"; color: #4ade80; margin-right: 5px; }

    #chat { flex: 1; overflow-y: auto; padding: 20px; background: #f8f9fc; }
    .row { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-end; }
    .row.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      background: #e0e7ff;
    }
    .row.user .avatar { background: #fce7f3; }
    .msg {
      max-width: 78%; padding: 11px 15px; border-radius: 16px;
      line-height: 1.5; font-size: 15px; word-wrap: break-word;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .bot  .msg { background: #fff; color: #1f2937; border-bottom-left-radius: 4px; }
    .user .msg { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff;
                 border-bottom-right-radius: 4px; }
    .msg ul { margin: 6px 0 6px 18px; }
    .msg p + p, .msg p + ul, .msg ul + p { margin-top: 6px; }

    .typing span {
      display: inline-block; width: 7px; height: 7px; margin: 0 2px;
      background: #9ca3af; border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px 0; background: #fff; }
    .chip {
      padding: 7px 14px; font-size: 13px; color: #4f46e5; cursor: pointer;
      background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 999px;
    }
    .chip:hover { background: #e0e7ff; }

    #form { display: flex; gap: 10px; padding: 14px 20px 16px; background: #fff; }
    #input {
      flex: 1; padding: 12px 16px; font-size: 15px; outline: none;
      border: 1px solid #d1d5db; border-radius: 999px;
    }
    #input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.15); }
    #send {
      width: 46px; height: 46px; border: 0; border-radius: 50%; cursor: pointer;
      color: #fff; font-size: 18px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }
    #send:disabled { opacity: .5; cursor: not-allowed; }
    @media (max-width: 500px) { #app { height: 96vh; border-radius: 14px; } .msg { max-width: 88%; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">🚀</div>
      <div>
        <h1>StartupMate AI</h1>
        <p>Your startup idea assistant</p>
      </div>
      <div class="online">Online</div>
    </header>

    <div id="chat"></div>

    <div id="chips">
      <div class="chip">💡 Give me startup ideas</div>
      <div class="chip">🎯 Find my target customers</div>
      <div class="chip">📋 Make a business plan</div>
    </div>

    <div id="form">
      <input id="input" placeholder="Tell me your startup idea..." autocomplete="off">
      <button id="send" title="Send">➤</button>
    </div>
  </div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const history = [];   // stores the whole conversation

  // Make the AI text look nice: **bold** and bullet points
  function format(text) {
    const safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    let html = "", inList = false;
    safe.split("\n").forEach(line => {
      line = line.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      if (/^\s*[-*•]\s+/.test(line)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + line.replace(/^\s*[-*•]\s+/, "") + "</li>";
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (line.trim()) html += "<p>" + line.replace(/^#+\s*/, "") + "</p>";
      }
    });
    if (inList) html += "</ul>";
    return html;
  }

  function addMessage(text, who) {
    const row = document.createElement("div");
    row.className = "row " + who;
    row.innerHTML = '<div class="avatar">' + (who === "bot" ? "🤖" : "🙂") +
                    '</div><div class="msg"></div>';
    const box = row.querySelector(".msg");
    if (who === "bot") box.innerHTML = format(text); else box.textContent = text;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return box;
  }

  async function sendMessage(text) {
    text = (text || input.value).trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    addMessage(text, "user");
    history.push({ role: "user", content: text });

    const box = addMessage("", "bot");
    box.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      box.innerHTML = format(data.reply);
      if (res.ok) history.push({ role: "assistant", content: data.reply });
      else history.pop();   // remove the failed message from history
    } catch (err) {
      box.textContent = "Network error: " + err.message;
      history.pop();
    }
    sendBtn.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }

  sendBtn.onclick = () => sendMessage();
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
  document.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => sendMessage(c.textContent.replace(/^\S+\s/, ""));
  });

  addMessage("Hi! 👋 I am StartupMate AI.\nTell me your startup idea, or ask me to help you find one.", "bot");
</script>
</body>
</html>
